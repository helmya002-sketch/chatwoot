name: Build Tolzar image

# Builds the Tolzar-branded Chatwoot image (docker/Dockerfile) and pushes it to GHCR.
# Coolify pulls ghcr.io/<owner>/tolzar-chatwoot. Heavy build (~20-40 min); runs on a
# GitHub-hosted Linux runner so it never loads the owner's server.

on:
  push:
    branches: [tolzar, main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: tolzar-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af || true
          df -h /

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase owner
        id: own
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.own.outputs.owner }}/tolzar-chatwoot:v4.19.0-tolzar
            ghcr.io/${{ steps.own.outputs.owner }}/tolzar-chatwoot:latest
          build-args: |
            RAILS_ENV=production
          cache-from: type=gha
          cache-to: type=gha,mode=max
