<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#3e63dd">
  <title>Tolzar: offline</title>
  <style>
    :root { color-scheme: light dark; --bg: #f8fafc; --card: #ffffff; --ink: #0f172a; --muted: #475569; --brand: #3e63dd; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0b1120; --card: #111827; --ink: #f1f5f9; --muted: #94a3b8; } }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
      font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; }
    main { min-height: 100%; display: grid; place-items: center; box-sizing: border-box;
      padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom)); }
    .card { max-width: 360px; text-align: center; background: var(--card); border-radius: 20px; padding: 32px 24px;
      box-shadow: 0 10px 30px -18px rgba(15, 23, 42, 0.45); }
    img { width: 64px; height: 64px; border-radius: 16px; }
    h1 { font-size: 20px; margin: 16px 0 8px; }
    p { color: var(--muted); margin: 0 0 20px; }
    .btn { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; min-width: 160px;
      border-radius: 12px; background: var(--brand); color: #fff; font-weight: 600; text-decoration: none; }
    .btn:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
  </style>
</head>
<body>
  <main>
    <div class="card">
      <img src="/apple-icon-180x180.png" alt="Tolzar">
      <h1>You're offline</h1>
      <p>Tolzar needs a connection to show your conversations. Nothing is kept on this phone while you're away.</p>
      <a class="btn" href="/app/">Try again</a>
    </div>
  </main>
</body>
</html>
