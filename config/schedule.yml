# https://github.com/ondrejbartas/sidekiq-cron
# use https://crontab.guru/ to validate
# validations for this file exist in /spec/configs/schedule_spec.rb

# Recover committed monitor work after interrupted jobs or enqueue failures.
dispatch_conversation_monitors_job:
  cron: '* * * * *'
  class: 'Internal::DispatchConversationMonitorsJob'
  queue: scheduled_jobs

# executed daily at 0000 UTC; schedules deferred jobs at stable times for each installation
internal_check_new_versions_job:
  cron: '0 0 * * *'
  class: 'Internal::TriggerDailyScheduledItemsJob'
  queue: scheduled_jobs
# # executed At every 5th minute..
trigger_scheduled_items_job:
  cron: '*/5 * * * *'
  class: 'TriggerScheduledItemsJob'
  queue: scheduled_jobs

# executed At every 5th minute by default, AUTO_RESOLVE_CRON overrides it
trigger_conversations_resolution_job:
  cron: <%= ENV.fetch('AUTO_RESOLVE_CRON', '*/5 * * * *').to_json %>
  class: 'Account::ConversationsResolutionSchedulerJob'
  queue: scheduled_jobs

# executed hourly for scheduled jobs that do not need minute-level cadence
trigger_hourly_scheduled_items_job:
  cron: '0 * * * *'
  class: 'Internal::TriggerHourlyScheduledItemsJob'
  queue: scheduled_jobs

# executed every 30 seconds
# ends calls that have rung past their provider's timeout
voice_ringing_timeout_job:
  cron: '*/30 * * * * *'
  class: 'Internal::CheckRingingTimeoutsJob'
  queue: scheduled_jobs

# executed At every minute..
trigger_imap_email_inboxes_job:
  cron: '*/1 * * * *'
  class: 'Inboxes::FetchImapEmailInboxesJob'
  queue: scheduled_jobs

# executed daily at 2230 UTC
# which is our lowest traffic time
remove_stale_contact_inboxes_job.rb:
  cron: '30 22 * * *'
  class: 'Internal::RemoveStaleContactInboxesJob'
  queue: scheduled_jobs

# executed daily at 2230 UTC
# which is our lowest traffic time
remove_stale_redis_keys_job.rb:
  cron: '30 22 * * *'
  class: 'Internal::RemoveStaleRedisKeysJob'
  queue: scheduled_jobs

# DISABLED: investigating if this job is the source of orphan conversations
# #executed daily at 0430 UTC
# # which will be IST 10:00 AM
# process_stale_contacts_job:
#   cron: '30 04 * * *'
#   class: 'Internal::ProcessStaleContactsJob'
#   queue: housekeeping

# executed daily at 0100 UTC
# to delete accounts marked for deletion
delete_accounts_job:
  cron: '0 1 * * *'
  class: 'Internal::DeleteAccountsJob'
  queue: scheduled_jobs

# executed every 30 minutes for assignment_v2
periodic_assignment_job:
  cron: '*/30 * * * *'
  class: 'AutoAssignment::PeriodicAssignmentJob'
  queue: scheduled_jobs

# executed daily at 2230 UTC
# removes old notifications (>1 month) and trims to 300 per user
remove_old_notification_job:
  cron: '30 22 * * *'
  class: 'Notification::RemoveOldNotificationJob'
  queue: purgable

# executed every 12 hours
# to remove orphan conversations without contact
remove_orphan_conversations_job:
  cron: '0 */12 * * *'
  class: 'Internal::RemoveOrphanConversationsJob'
  queue: housekeeping

# Tolzar: executed daily at 0515 UTC (after the 02:00 backup and the 03:10-04:30 maintenance window)
# deletes conversations past a workspace's retention period (only workspaces whose Owner set one)
tolzar_conversation_retention_job:
  cron: '15 5 * * * UTC'
  class: 'Tolzar::ConversationRetentionJob'
  queue: housekeeping

# Tolzar: executed daily at 0530 UTC
# empties respond.io mirror payloads 180 days after they were projected (ids and times stay)
tolzar_mirror_event_prune_job:
  cron: '30 5 * * * UTC'
  class: 'Tolzar::MirrorEventPruneJob'
  queue: housekeeping

# Tolzar: executed daily at 0545 UTC
# billing v1: purges workspaces paused for the full 30-day hold (only with TOLZAR_BILLING_ENFORCE=true)
tolzar_subscription_purge_job:
  cron: '45 5 * * * UTC'
  class: 'Tolzar::SubscriptionPurgeJob'
  queue: housekeeping

# Tolzar: executed every 15 minutes
# TikTok comments on the business's own videos into the TikTok inbox (only for TOLZAR_TIKTOK_COMMENTS workspaces)
tolzar_tiktok_comments_poll_job:
  cron: '*/15 * * * * UTC'
  class: 'Tolzar::TiktokCommentsPollJob'
  queue: low

# Tolzar: executed hourly at minute 17
# fair use per plan: AI replies this month vs the plan's allowance; notices only (only with TOLZAR_FAIR_USE=true)
# Tolzar owner's daily digest (c89): TOLZAR_DIGEST_ACCOUNTS workspaces only, 07:05 UTC.
tolzar_daily_digest_job:
  cron: '5 7 * * * UTC'
  class: 'Tolzar::DailyDigestJob'
  queue: low
tolzar_weekly_report_job:
  cron: '15 7 * * 1 UTC'
  class: 'Tolzar::WeeklyReportJob'
  queue: low
tolzar_fair_use_job:
  cron: '17 * * * * UTC'
  class: 'Tolzar::FairUseJob'
  queue: low
