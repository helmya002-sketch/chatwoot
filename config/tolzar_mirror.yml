# Tolzar shadow mirror — tenant registry (no secrets; signing keys come from env).
# account_id: use this existing Chatwoot account if it exists; otherwise the
# projector find_or_creates one named account_name. aquarius = the primary
# account (1); xplorer = its own mirror account.
# P2.1 may add `inboxes:` mapping each respond.io channel id -> a mirror inbox id;
# P2 (v1) uses a single API "Respond.io Mirror" inbox per account.
tenants:
  aquarius:
    space_id: 282271
    account_id: 1
    account_name: "Aquarius (mirror)"
  xplorer:
    space_id: 484132
    account_id: 3
    account_name: "Xplorer Red Sea (mirror)"
